name: prod workflow
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      environment:
        required: false
        type: string
jobs:
  non-prod:
    runs-on: nodejs
    steps: 
    - name: compute commit
      id: commit
      run: |
        short_sha=${{ inputs.version }}
        appVersion=${short_sha::9}
        echo "appVersion=$appVersion" >> $GITHUB_ENV

    - name: Check required commit statuses
      id: gate
      shell: bash
      run: |
          echo "🔍 Checking commit statuses for ${{ inputs.version }}"

          REQUIRED_CONTEXTS=(
            "DOCKER_BUILD"
            "UNIT_TESTS"
            "SCANS"
            "UAT_DEPLOY"
          )

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.version }}/statuses")

          FAILED=0

          for CONTEXT in "${REQUIRED_CONTEXTS[@]}"; do
            STATE=$(echo "$RESPONSE" | jq -r \
              ".[] | select(.context == \"$CONTEXT\") | .state" | head -n 1)

            if [ -z "$STATE" ]; then
              echo "❌ $CONTEXT → status missing"
              FAILED=1
            elif [ "$STATE" != "success" ]; then
              echo "❌ $CONTEXT → $STATE"
              FAILED=1
            else
              echo "✅ $CONTEXT → success"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "🚫 UAT gate failed"
            exit 1
          fi

          echo "🎉 All required checks passed"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.1
      with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: authenticate to EKS
      run: |
          aws eks update-kubeconfig --region us-east-1 --name roboshop-dev
          kubectl get nodes

    - name: checkout catalogue deploy repo
      uses: actions/checkout@v6
      with:
          repository: nihu-ci/catalogue-deploy

    - name: deploy to ${{ inputs.environment }} cluster
      id: prod_deploy
      run: "helm upgrade --install catalogue -f values-dev.yaml -n roboshop --set deployment.imageVersion=${appVersion} --atomic --wait --timeout=5m ."

    - name: Update Deploy status
      if: always()
      uses: nihu-ci/usable-workflow/.github/actions@main
      with:
          sha: ${{ inputs.version }}
          state: ${{ steps.prod_deploy.outcome }}     # success / failure / cancelled
          context: PROD_DEPLOY
          description: ${{ steps.prod_deploy.outcome }}